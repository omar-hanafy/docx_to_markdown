name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test-stable:
    name: Test on stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (stable)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Version channel check
        if: github.base_ref == 'main' || github.base_ref == 'dev' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail
          lane="${GITHUB_BASE_REF:-$GITHUB_REF_NAME}"
          version=$(awk '/^version:/ {print $2; exit}' pubspec.yaml | tr -d "\"'")
          stable_pattern='^[0-9]+\.[0-9]+\.[0-9]+(\+[0-9A-Za-z.-]+)?$'
          prerelease_pattern='^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+(\+[0-9A-Za-z.-]+)?$'
          if [[ "$lane" == 'main' && ! "$version" =~ $stable_pattern ]]; then
            echo "Main requires a stable semantic version, got $version."
            exit 1
          fi
          if [[ "$lane" == 'dev' && ! "$version" =~ $prerelease_pattern ]]; then
            echo "Dev requires a prerelease semantic version, got $version."
            exit 1
          fi

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  test-beta:
    name: Test on beta
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (beta)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: beta

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  test-min-sdk:
    name: Test on min SDK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Keep in sync with the lower bound of `environment.sdk` in pubspec.yaml.
      - name: Setup Dart (min SDK)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.13.5"

      - name: Install dependencies
        run: dart pub get

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  test-min-dependencies:
    name: Test on minimum dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (min SDK)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: "3.13.5"

      - name: Resolve minimum dependencies
        run: dart pub downgrade

      # test_core 0.6.21 permits frontend_server_client 3.2.0, which expects the
      # frontend_server.dart.snapshot removed from current Dart SDKs. Keep the
      # full public dependency graph downgraded and upgrade only this test tool.
      # Remove this step when test_core requires a compatible client itself.
      - name: Use a test runner compatible with the minimum SDK
        run: dart pub upgrade frontend_server_client

      - name: Analyze
        run: dart analyze

      - name: Test
        run: dart test

  test-browser:
    name: Test on Chrome
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (stable)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Test browser conversion
        run: dart test --platform chrome test/web_conversion_test.dart

  pana:
    name: Pana
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (stable)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Install pana
        run: dart pub global activate pana 0.23.19

      - name: Run pana (full score required)
        run: pana --exit-code-threshold 0 .

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Dart (stable)
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Collect coverage
        run: dart test --coverage=coverage

      - name: Format LCOV
        run: >-
          dart run coverage:format_coverage --lcov --in=coverage
          --out=coverage/lcov.info
          --packages=.dart_tool/package_config.json --report-on=lib

      # Public repos need no token. Delete this step for a token-free setup.
      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false
