name: Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  # A project site is served from https://<user>.github.io/<repo>/, so the site
  # must be built for that subpath. Astro has no `--base-href` flag: the deploy
  # base is `base` in astro.config.mjs, which reads BASE_PATH, and every
  # internal link and asset goes through withBase() in src/lib/url.ts. No
  # trailing slash here - Astro normalizes it to /docx_to_markdown/.
  BASE_PATH: /docx_to_markdown
  # Origin used for canonical URLs, Open Graph tags, robots.txt and the
  # sitemap. Read by `site` in astro.config.mjs, whose default points at a
  # custom domain that is not in use, so this must be passed explicitly.
  SITE_URL: https://omar-hanafy.github.io

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    concurrency:
      # A new commit supersedes an older build of the same pull request. Main
      # builds serialize so an older build cannot reach production after a
      # newer one.
      group: pages-build-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No Dart SDK is needed. The conversion engine is the package compiled to
      # JavaScript and committed at website/public/converter/converter.js; it is
      # regenerated by hand with `npm run build:bridge`, not by this workflow.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Astro 5 requires 18.20.8 || ^20.3.0 || >=22.0.0, and the rest of the
          # dependency tree floors at Node 20.19. 22 is the lowest active LTS
          # that satisfies every constraint.
          node-version: "22"
          cache: npm
          # An action's `with:` inputs are resolved from the repository root,
          # not from defaults.run.working-directory.
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify the built base path
        # A wrong deploy base is the failure mode for project sites: the page
        # loads, then every asset 404s and nothing paints. Cheaper to fail here
        # than to discover it as a broken page in production. Astro rewrites
        # every internal root-relative URL to "$BASE_PATH/...", so one hashed
        # asset reference plus the canonical tag prove both the base and the
        # origin landed.
        run: |
          if ! grep -q "\"$BASE_PATH/_astro/" dist/index.html; then
            echo "dist/index.html references no build asset under $BASE_PATH/_astro/."
            echo "The site was built without the deploy base; every asset would 404."
            grep -o '"[^"]*_astro/[^"]*"' dist/index.html | sort -u | head || true
            exit 1
          fi
          actual=$(grep -o 'rel="canonical" href="[^"]*"' dist/index.html | head -1)
          expected="rel=\"canonical\" href=\"$SITE_URL$BASE_PATH\""
          if [ "$actual" != "$expected" ]; then
            echo "Expected $expected but the build produced ${actual:-no canonical tag}."
            exit 1
          fi
          echo "$actual"

      - name: Verify the site content was built
        # Two things can go wrong without failing the build. Astro can emit a
        # shell with none of the site copy, and the committed converter engine
        # can go missing from public/, which publishes a page that renders but
        # cannot convert anything.
        #
        # MARKER is a user-visible string that exists solely on this site's home
        # page (website/src/pages/index.astro). If this step fails after a copy
        # edit, update MARKER to match.
        run: |
          MARKER="Markdown that keeps its structure."
          if ! grep -qF "$MARKER" dist/index.html; then
            echo "Built output does not contain the home page marker: $MARKER"
            echo "Either the wrong site was built, or the hero copy changed."
            exit 1
          fi
          if [ ! -s dist/converter/converter.js ]; then
            echo "dist/converter/converter.js is missing or empty."
            echo "public/converter/converter.js is the committed Dart-to-JavaScript"
            echo "engine; regenerate it with 'npm run build:bridge'."
            exit 1
          fi

      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Relative to the repository root, not to the working directory above.
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    # Pull requests and manual dispatches from non-main branches build and
    # verify, but never publish.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      # GitHub Pages has one production target. Serialize every deployment
      # regardless of the triggering run or branch ref.
      group: pages-production
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
